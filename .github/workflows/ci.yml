name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Dummy values: the spec generator loads the env schema but never connects to either.
      - name: Check openapi.json is up to date
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          BETTER_AUTH_SECRET: ci-only-dummy-secret-not-used-at-runtime-0000
        run: |
          pnpm openapi
          git diff --exit-code openapi.json
      # Same Tectonic version as backend/Dockerfile, so the LaTeX tests run the compiler production uses.
      - name: Install Tectonic
        run: |
          curl -fsSL "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar -xz -C /usr/local/bin tectonic
          tectonic --version
      # Downloads the TeX packages the templates use before the tests, so a cold cache can't time out a compile test.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/Tectonic
          key: tectonic-0.17.0-${{ hashFiles('backend/src/templates/**', 'backend/src/scripts/warm-tectonic.ts') }}
          restore-keys: tectonic-0.17.0-
      - run: pnpm exec tsx src/scripts/warm-tectonic.ts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check schema.d.ts is up to date
        run: |
          pnpm api:types
          git diff --exit-code src/lib/api/schema.d.ts
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm check
      - run: for f in src/lib/*.check.ts; do node $f || exit 1; done
      - run: pnpm build
