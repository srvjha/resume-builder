name: Deploy backend

# The frontend deploys itself through Vercel's GitHub integration; this ships the backend to the VPS.
on:
  push:
    branches: [main]
    # Frontend changes deploy through Vercel, and documentation changes run nothing on the server.
    paths:
      - "backend/**"
      - "!backend/**/*.md"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits instead of racing the current one.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Pull and restart on the VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          command_timeout: 30m
          script: |
            set -e
            cd ~/shortlist
            git fetch --quiet origin main
            # The commit this run checked, not main's tip, which may be a newer push still in its own check.
            git reset --hard ${{ github.sha }}
            cd backend
            compose="docker compose -f docker-compose.prod.yml --env-file .env.production"
            # Build and migrate while the old API still serves; a failed migration stops here and leaves it running.
            $compose build
            $compose run --rm shortlist-api node dist/scripts/migrate.js
            $compose up -d --wait --remove-orphans
            docker image prune -f
      - name: Check the API answers
        run: curl -fsS --retry 20 --retry-delay 6 --retry-all-errors https://api.shortlist.co.in/health
