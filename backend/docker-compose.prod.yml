# Production stack for the VPS: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# HTTPS comes from the Caddy already running on the VPS; add deploy/Caddyfile's block to its Caddyfile.
name: resumebuilder

services:
  api:
    build: { context: ., target: api }
    restart: unless-stopped
    env_file: .env.production
    # server.ts drains open requests on SIGTERM; AI calls can take ~2.5 min, so give deploys time before SIGKILL.
    stop_grace_period: 3m
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@shortlist-postgres:5432/resumebuilder
      COMPILER_URL: http://compiler:4100
    networks:
      edge: {}
      backend: {}
      compile: {}
      # Shared with the Caddy that already serves ports 80/443 on the VPS; the alias avoids
      # clashing with other apps' services on that network.
      proxy:
        aliases: [shortlist-api]
    depends_on:
      postgres: { condition: service_healthy }
      compiler: { condition: service_started }

  worker:
    build: { context: ., target: api }
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file: .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@shortlist-postgres:5432/resumebuilder
      COMPILER_URL: http://compiler:4100
    # edge gives outbound internet access (R2, AI providers); backend reaches Postgres.
    networks: [edge, backend]
    depends_on: [api]

  # Untrusted LaTeX runs here: no secrets, no internet (internal network only), read-only filesystem, capped resources.
  compiler:
    build: { context: ., target: compiler }
    restart: unless-stopped
    environment:
      COMPILE_TIMEOUT_MS: "20000"
      # Three at once on the 4-core VPS, still capped below so a burst can't starve the API, Postgres or the other app.
      COMPILE_CONCURRENCY: "3"
    read_only: true
    tmpfs:
      - /tmp:size=384m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1536m
    cpus: 2.5
    pids_limit: 128
    networks: [compile]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: resumebuilder
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resumebuilder"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      # The api also sits on the proxy network, where other apps may have a "postgres" too.
      backend:
        aliases: [shortlist-postgres]

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
    networks: [edge, backend]
    depends_on:
      postgres: { condition: service_healthy }

networks:
  # The existing reverse proxy's network, e.g. otherapp_default. Find it with: docker network ls
  proxy:
    external: true
    name: ${PROXY_NETWORK}
  edge: {}
  backend: { internal: true }
  compile: { internal: true }

volumes:
  postgres-data:
